<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cuenta regresiva</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fdf6f0;
    color: #3a2e2a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 16px;
  }
  .tarjeta {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    padding: 32px 20px;
    max-width: 480px;
    width: 100%;
  }
  h1 { font-size: 1.5rem; margin-bottom: 6px; }
  .nombre { font-size: 2rem; font-weight: 800; color: #b4552d; margin-bottom: 8px; }
  .mensaje { font-size: 1rem; color: #6b5a52; margin-bottom: 24px; }
  .contador { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .caja {
    background: #fdf6f0;
    border-radius: 12px;
    padding: 12px 6px;
    min-width: 68px;
  }
  .numero { font-size: 2rem; font-weight: 800; line-height: 1; }
  .etiqueta { font-size: 0.75rem; color: #6b5a52; margin-top: 4px; }
  .fecha { font-size: 0.95rem; color: #6b5a52; margin-bottom: 20px; }
  .boton {
    display: inline-block;
    background: #25d366;
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 1rem;
  }
  .boton.oculto { display: none; }
  .pie { margin-top: 20px; font-size: 0.8rem; color: #a08d84; }
</style>
</head>
<body>
  <div class="tarjeta">
    <h1 id="titulo">¡Falta poco!</h1>
    <div class="nombre" id="nombre"></div>
    <p class="mensaje" id="mensaje"></p>
    <div class="contador" id="contador">
      <div class="caja"><div class="numero" id="dias">--</div><div class="etiqueta">días</div></div>
      <div class="caja"><div class="numero" id="horas">--</div><div class="etiqueta">horas</div></div>
      <div class="caja"><div class="numero" id="minutos">--</div><div class="etiqueta">min</div></div>
      <div class="caja"><div class="numero" id="segundos">--</div><div class="etiqueta">seg</div></div>
    </div>
    <p class="fecha" id="fecha"></p>
    <a class="boton oculto" id="whatsapp" href="#" target="_blank" rel="noopener">Confirmar por WhatsApp</a>
    <p class="pie">Hecho con DUMO Studio</p>
  </div>
<script>
  // ============================================================
  // CONFIGURACIÓN: edita solo estos datos para cada evento.
  // - fecha: año-mes-día y hora, con la zona horaria de México
  //   (por ejemplo "2026-11-29T00:00:00-06:00").
  // - whatsapp: número con código de país, sin + ni espacios
  //   (por ejemplo "5218112345678"). Si lo dejas vacío, el
  //   botón de WhatsApp no se muestra.
  // ============================================================
  const CONFIG = {
    titulo: "¡Falta poco para la fiesta!",
    nombre: "Nombre de la persona",
    mensaje: "Te esperamos para festejar juntos.",
    fecha: "2027-06-15T18:00:00-06:00",
    whatsapp: "",
    mensajeWhatsapp: "Hola, confirmo mi asistencia."
  };

  const meta = new Date(CONFIG.fecha);
  document.getElementById("titulo").textContent = CONFIG.titulo;
  document.getElementById("nombre").textContent = CONFIG.nombre;
  document.getElementById("mensaje").textContent = CONFIG.mensaje;
  document.getElementById("fecha").textContent = meta.toLocaleDateString("es-MX", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });

  const boton = document.getElementById("whatsapp");
  if (CONFIG.whatsapp) {
    boton.href = "https://wa.me/" + CONFIG.whatsapp +
      "?text=" + encodeURIComponent(CONFIG.mensajeWhatsapp);
    boton.classList.remove("oculto");
  }

  function dos(n) { return String(n).padStart(2, "0"); }
  function actualizar() {
    const ahora = new Date();
    let diferencia = meta - ahora;
    if (diferencia <= 0) {
      document.getElementById("contador").innerHTML =
        "<p style='font-size:1.3rem;font-weight:800'>¡Llegó el día!</p>";
      return;
    }
    const dias = Math.floor(diferencia / 86400000);
    const horas = Math.floor(diferencia / 3600000) % 24;
    const minutos = Math.floor(diferencia / 60000) % 60;
    const segundos = Math.floor(diferencia / 1000) % 60;
    document.getElementById("dias").textContent = dias;
    document.getElementById("horas").textContent = dos(horas);
    document.getElementById("minutos").textContent = dos(minutos);
    document.getElementById("segundos").textContent = dos(segundos);
  }
  actualizar();
  setInterval(actualizar, 1000);
</script>
</body>
</html>
