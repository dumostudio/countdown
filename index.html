<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isaac Gregory cumple 12 · Abdaylan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffdf7; --ink:#333333; --rojo:#e5251b; --azul:#0a3cff; --verde:#18b838; --suave:#555;
    --caja:#0a3cff; --caja-txt:#fff; --sombra:#e5251b;
  }
  [data-tema="oscuro"]{
    --bg:#0b0b0f; --ink:#fff; --suave:#bbb; --caja:#1e1e28; --caja-txt:#ffcc00; --sombra:#00e5ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Montserrat',system-ui,sans-serif; text-align:center;
    height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
    padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
  }
  .flag{
    width:min(100%,300px); height:clamp(78px,14dvh,110px);
    display:grid; grid-template-rows:40% 30% 30%;
    border:1px solid var(--ink); border-radius:12px; overflow:hidden;
  }
  .flag .azul{background:#0a3cff;color:#fff;display:flex;justify-content:space-around;align-items:center;font-size:clamp(.9rem,3.4dvh,1.4rem)}
  .flag .blanco{background:#fff;color:var(--verde);display:grid;place-items:center;font:700 clamp(.8rem,2.8dvh,1.2rem) 'Fredoka',sans-serif}
  .flag .rayas{background:repeating-linear-gradient(#e5251b 0 3px,#fff 3px 6px)}
  .badge{
    background:var(--ink);color:var(--bg);padding:5px 14px;border-radius:50px;
    font-weight:800;font-size:clamp(.6rem,2.6vw,.75rem);letter-spacing:.5px;text-transform:uppercase;
  }
  h1{font:700 clamp(1.7rem,9vw,2.6rem)/1.05 'Fredoka',sans-serif;color:var(--rojo)}
  h1 span{display:block}
  .lema{font-weight:800;font-size:clamp(.8rem,3.6vw,1rem);color:var(--azul)}
  [data-tema="oscuro"] .lema{color:#00e5ff}
  .arcoiris{width:min(70%,220px);height:4px;border-radius:4px;
    background:linear-gradient(90deg,#e5251b,#ff9a00,#ffd400,#18b838,#0a3cff,#8a2be2)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px}
  .caja{
    background:var(--caja);color:var(--caja-txt);border:3px solid var(--ink);border-radius:12px;
    box-shadow:3px 3px 0 var(--sombra);padding:8px 2px;
  }
  .num{display:block;font:700 clamp(1.6rem,9vw,2.3rem)/1 'Fredoka',sans-serif}
  .lab{display:block;font-size:clamp(.5rem,2.4vw,.65rem);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;opacity:.9}
  .secreto{font-size:clamp(.75rem,3.4vw,.9rem);color:var(--suave);line-height:1.4;max-width:300px}
  .wa{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:#25d366;color:#fff;text-decoration:none;font-weight:800;
    font-size:clamp(.85rem,4vw,1rem);padding:14px 22px;border-radius:50px;
    border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  }
  .wa:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .firma{font-size:.65rem;color:var(--suave);letter-spacing:.3px}

  #conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
  .mudo{
    position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:20;
    width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--bg);
    font-size:1.1rem;line-height:1;cursor:pointer;
  }
  .mudo[hidden]{display:none}

  /* ---- cortinilla con la bomba ---- */
  .cortina{
    position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 50% 40%,#fff6d6 0,var(--bg) 70%);
    transition:transform .6s cubic-bezier(.6,0,.9,.4);
  }
  .cortina.sube{transform:translateY(-105%)}
  .cortina .toca{font:700 clamp(1.4rem,7vw,2rem) 'Fredoka',sans-serif;color:var(--ink)}
  .bomba{background:none;border:0;cursor:pointer;width:min(55vw,210px);animation:tiembla .5s ease-in-out infinite}
  .bomba svg{width:100%;height:auto;display:block}
  .chispa{transform-origin:100px 18px;animation:chispa .25s ease-in-out infinite alternate}
  .cortina.boom .bomba{animation:explota .45s ease-in forwards}
  @keyframes tiembla{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes chispa{from{transform:scale(.7) rotate(0)}to{transform:scale(1.3) rotate(25deg)}}
  @keyframes explota{0%{transform:scale(1)}60%{transform:scale(1.4)}100%{transform:scale(3.2);opacity:0}}
  @media (prefers-reduced-motion:reduce){.bomba,.chispa{animation:none}}
</style>
</head>
<body>

  <div class="flag" aria-hidden="true">
    <div class="azul"><span>☾</span><span>★</span><span>☽</span></div>
    <div class="blanco">Alá Velik</div>
    <div class="rayas"></div>
  </div>

  <div class="badge">República de Abdaylan · Capital: Salum</div>
  <h1 id="titulo"></h1>
  <p class="lema">Make countdown as soon as possible!</p>
  <div class="arcoiris"></div>

  <div class="grid" id="contador">
    <div class="caja"><span class="num" id="d">00</span><span class="lab">Días</span></div>
    <div class="caja"><span class="num" id="h">00</span><span class="lab">Horas</span></div>
    <div class="caja"><span class="num" id="m">00</span><span class="lab">Min</span></div>
    <div class="caja"><span class="num" id="s">00</span><span class="lab">Seg</span></div>
  </div>

  <p class="secreto" id="secreto">🔒 Lugar: ¡misión secreta! Los detalles se piden por WhatsApp.</p>
  <a class="wa" id="wa" href="#" target="_blank" rel="noopener">💬 Pedir detalles por WhatsApp</a>
  <p class="firma">#$ Isaac Gregory’s official design © 2026</p>

  <canvas id="conf" aria-hidden="true"></canvas>
  <button class="mudo" id="mudo" type="button" hidden aria-label="Silenciar o activar música">🔊</button>

  <div class="cortina" id="cortina">
    <button class="bomba" id="bomba" type="button" aria-label="Tocar la bomba">
      <svg viewBox="0 0 120 130" aria-hidden="true">
        <path d="M70 34 C78 22 90 24 98 18" fill="none" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/>
        <rect x="52" y="26" width="26" height="16" rx="4" fill="#666"/>
        <circle cx="62" cy="84" r="44" fill="#333"/>
        <ellipse cx="46" cy="66" rx="11" ry="7" fill="#fff" opacity=".35" transform="rotate(-35 46 66)"/>
        <g class="chispa"><polygon points="100,6 104,15 114,16 106,22 109,32 100,26 91,32 94,22 86,16 96,15" fill="#ffd400" stroke="#ff9a00" stroke-width="2"/></g>
      </svg>
    </button>
    <p class="toca">¡Toca la bomba!</p>
  </div>

<script>
  // ===== CONFIG: lo único que se cambia por cliente/tema =====
  const CONFIG = {
    nombre:   "Isaac Gregory",
    edad:     12,
    fecha:    new Date(2026, 10, 29, 12, 0, 0),   // año, mes (0=ene → 10=nov), día, hora, min
    whatsapp: "528110314514",                      // 52 + número, sin espacios
    mensaje:  "Hola, quiero los detalles de la fiesta de Isaac Gregory",
    tema:     "claro",                             // "claro" u "oscuro"
    musicaFiesta: "fiesta.mp3",                    // suena en loop durante el countdown
    musicaCumple: "cumple.mp3",                    // suena al llegar a cero
    minutosConfeti: 5                              // la lluvia de confeti se detiene a los 5 min
  };
  // ============================================================

  const $ = id => document.getElementById(id);
  document.documentElement.dataset.tema = CONFIG.tema;
  function poner(l1, l2){
    const h = $("titulo"); h.replaceChildren();
    [l1, l2].forEach(t => { const sp = document.createElement("span"); sp.textContent = t; h.appendChild(sp); });
  }
  poner(CONFIG.nombre, `¡Cumple ${CONFIG.edad}!`);
  $("wa").href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(CONFIG.mensaje);

  /* ---------- CONFETI: explosión + lluvia continua ---------- */
  const cv = $("conf"), g2 = cv.getContext("2d");
  const COL = ["#e5251b","#0a3cff","#ffd400","#18b838","#ff9a00","#8a2be2"];
  let ps = [], raf = 0, lluvia = false;
  function ajustar(){ cv.width = innerWidth; cv.height = innerHeight; }
  ajustar(); addEventListener("resize", ajustar);

  function confeti(x, y, n = 160){
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
      ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6,
        w: 6 + Math.random() * 6, h: 3 + Math.random() * 5,
        r: Math.random() * 6, vr: (Math.random() - .5) * .4,
        c: COL[i % COL.length], vida: 90 + Math.random() * 60 });
    }
    if (!raf) raf = requestAnimationFrame(paso);
  }
  function paso(){
    g2.clearRect(0, 0, cv.width, cv.height);
    if (lluvia && ps.length < 220){
      for (let i = 0; i < 2; i++) ps.push({ x: Math.random() * cv.width, y: -10,
        vx: (Math.random() - .5) * 1.2, vy: 1.5 + Math.random() * 2.5,
        w: 6 + Math.random() * 5, h: 3 + Math.random() * 5,
        r: Math.random() * 6, vr: (Math.random() - .5) * .3,
        c: COL[Math.floor(Math.random() * COL.length)], vida: Infinity, cae: true });
    }
    ps = ps.filter(p => p.vida > 0 && p.y < cv.height + 20);
    ps.forEach(p => {
      if (p.cae){ p.x += p.vx + Math.sin(p.y / 30 + p.r) * .6; p.y += p.vy; }
      else { p.vx *= .985; p.vy += .25; p.x += p.vx; p.y += p.vy; p.vida--; }
      p.r += p.vr;
      g2.save(); g2.translate(p.x, p.y); g2.rotate(p.r);
      g2.globalAlpha = Math.min(1, p.vida / 30); g2.fillStyle = p.c;
      g2.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g2.restore();
    });
    raf = (ps.length || lluvia) ? requestAnimationFrame(paso) : 0;
  }

  /* ---------- MÚSICA: archivos mp3; si faltan, melodía sintetizada ---------- */
  const AUD = { espera: new Audio(CONFIG.musicaFiesta), cumple: new Audio(CONFIG.musicaCumple) };
  Object.values(AUD).forEach(a => { a.loop = true; a.preload = "auto"; });
  const FIESTA = [[72,1],[76,1],[79,1],[76,1],[81,1],[79,1],[76,1],[72,1],
                  [74,1],[77,1],[81,1],[77,1],[79,1],[76,1],[74,1],[72,1]];
  const CUMPLE = [[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],
                  [67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
                  [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,1],
                  [77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2],[0,2]];
  let ctx = null, bus = null, token = null, mudo = false, modo = "espera";

  function detenerSynth(){
    token = null;
    if (bus){ bus.gain.cancelScheduledValues(0); bus.gain.value = 0; bus.disconnect(); bus = null; }
  }
  function nota(m, t, dur){
    const o = ctx.createOscillator(), v = ctx.createGain();
    o.type = "triangle"; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(.2, t + .02);
    v.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(v); v.connect(bus); o.start(t); o.stop(t + dur + .05);
  }
  function synth(seq, pulso){
    detenerSynth();
    if (!ctx || mudo) return;
    bus = ctx.createGain(); bus.gain.value = .9; bus.connect(ctx.destination);
    const id = token = {};
    let t = ctx.currentTime + .05;
    (function programar(){
      if (token !== id) return;
      seq.forEach(([m, b]) => { if (m) nota(m, t, b * pulso * .95); t += b * pulso; });
      setTimeout(programar, Math.max(0, (t - ctx.currentTime - .3) * 1000));
    })();
  }
  function detener(){ Object.values(AUD).forEach(a => a.pause()); detenerSynth(); }
  function sonar(){
    detener();
    if (mudo) return;
    const k = modo, a = AUD[k];
    a.currentTime = 0;
    a.play().catch(() => {                       // sin archivo: usa la melodía sintetizada
      if (!mudo && modo === k) k === "cumple" ? synth(CUMPLE, .42) : synth(FIESTA, .2);
    });
  }

  /* ---------- BOMBA (cortinilla) y botón de música ---------- */
  let iniciado = false;
  $("bomba").addEventListener("click", () => {
    if (iniciado) return;
    iniciado = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    $("cortina").classList.add("boom");
    sonar();
    setTimeout(() => {
      confeti(innerWidth / 2, innerHeight / 2, 220);
      lluvia = true;
      setTimeout(() => { lluvia = false; }, CONFIG.minutosConfeti * 60000);
      if (!raf) raf = requestAnimationFrame(paso);
      $("cortina").classList.add("sube");
      $("mudo").hidden = false;
    }, 450);
    setTimeout(() => $("cortina").remove(), 1200);
  });
  $("mudo").addEventListener("click", () => {
    mudo = !mudo;
    $("mudo").textContent = mudo ? "🔇" : "🔊";
    mudo ? detener() : sonar();
  });

  /* ---------- CONTADOR ---------- */
  function tick(){
    const dif = CONFIG.fecha - new Date();
    if (dif <= 0){
      poner("¡Feliz cumpleaños", CONFIG.nombre + "!");
      ["d","h","m","s"].forEach(id => $(id).textContent = "00");
      $("wa").remove();
      $("secreto").textContent = "¡Misión cumplida en Abdaylan! 🎉";
      modo = "cumple";
      if (iniciado) { [.2, .5, .8].forEach(f => confeti(innerWidth * f, innerHeight * .4, 170)); sonar(); }
      clearInterval(timer);
      return;
    }
    const p = n => String(n).padStart(2, "0");
    $("d").textContent = p(Math.floor(dif / 864e5));
    $("h").textContent = p(Math.floor(dif % 864e5 / 36e5));
    $("m").textContent = p(Math.floor(dif % 36e5 / 6e4));
    $("s").textContent = p(Math.floor(dif % 6e4 / 1e3));
  }
  const timer = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
